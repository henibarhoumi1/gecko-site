name: tmp-ws-shots
# Temporary: screenshots of the home workspace section while its tour plays. Removed before merging.
on:
  push:
    branches: [workspace-hero]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: |
          cat > /tmp/shots.mjs <<'JS'
          import { spawn } from 'node:child_process';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { chromium } from 'playwright';
          mkdirSync('/tmp/out', { recursive: true });
          const srv = spawn('npx', ['astro', 'preview', '--port', '4321'], { stdio: 'inherit' });
          await new Promise((r) => setTimeout(r, 5000));
          const b = await chromium.launch();
          const notes = [];
          for (const [name, vp] of [['desk', { width: 1440, height: 900 }], ['phone', { width: 390, height: 844 }]]) {
            const ctx = await b.newContext({ viewport: vp, deviceScaleFactor: 1, isMobile: name === 'phone' });
            const p = await ctx.newPage();
            const errs = []; p.on('pageerror', (e) => errs.push(String(e))); p.on('console', (m) => m.type() === 'error' && errs.push(m.text()));
            await p.goto('http://localhost:4321/en/', { waitUntil: 'networkidle' });
            await p.evaluate(() => document.querySelector('#workspace').scrollIntoView({ block: 'start' }));
            for (let t = 0; t < 12; t++) {
              await p.waitForTimeout(1350);
              await p.screenshot({ path: `/tmp/out/${name}-${String(t).padStart(2, '0')}.png`, fullPage: false });
            }
            const wide = await p.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            notes.push({ name, wide, errs });
            await ctx.close();
          }
          await b.close(); srv.kill();
          writeFileSync('/tmp/out/notes.json', JSON.stringify(notes, null, 2));
          JS
          node /tmp/shots.mjs
      - if: always()
        run: |
          cd /tmp/out && git init -q && git checkout -q -b ws-shots
          git config user.name shots && git config user.email shots@users.noreply.github.com
          git add -A && git commit -qm "shots $GITHUB_SHA" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ws-shots
