name: tmp-ws-shots
# Temporary: screenshots of the home workspace section at several widths. Removed before merging.
on:
  push:
    branches: [workspace-balance]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: |
          cat > shots.mjs <<'JS'
          import { spawn } from 'node:child_process';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { chromium } from 'playwright';
          mkdirSync('/tmp/out', { recursive: true });
          const srv = spawn('npx', ['astro', 'preview', '--port', '4321'], { stdio: 'inherit' });
          await new Promise((r) => setTimeout(r, 5000));
          const b = await chromium.launch();
          const notes = [];
          for (const w of [1920, 1440, 1180, 1024, 768, 390]) {
            const ctx = await b.newContext({ viewport: { width: w, height: 1000 }, deviceScaleFactor: 1, isMobile: w < 500 });
            const p = await ctx.newPage();
            const errs = []; p.on('pageerror', (e) => errs.push(String(e)));
            await p.goto('http://localhost:4321/en/', { waitUntil: 'networkidle' });
            await p.evaluate(() => document.querySelector('#workspace').scrollIntoView({ block: 'start' }));
            await p.waitForTimeout(3200);
            await p.locator('#workspace').screenshot({ path: `/tmp/out/ws-${w}.png` });
            const m = await p.evaluate(() => {
              const r = (s) => { const e = document.querySelector(s); if (!e) return null; const b = e.getBoundingClientRect(); return [Math.round(b.left), Math.round(b.right)]; };
              return { sw: document.documentElement.scrollWidth, cw: document.documentElement.clientWidth, title: r('#workspace .ws-title'), steps: r('#workspace .steps'), app: r('#workspace .app'), wrap: r('#workspace .wrap') };
            });
            notes.push({ w, ...m, errs });
            await ctx.close();
          }
          await b.close(); srv.kill();
          writeFileSync('/tmp/out/notes.json', JSON.stringify(notes, null, 1));
          JS
          node shots.mjs
      - if: always()
        run: |
          cd /tmp/out && git init -q && git checkout -q -b ws-shots
          git config user.name shots && git config user.email shots@users.noreply.github.com
          git add -A && git commit -qm "shots $GITHUB_SHA" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ws-shots
