name: site-audit
# A one-off look at the live site from outside: screenshots on desktop and phone, page basics, broken
# links, and Lighthouse scores. Results are uploaded as an artifact.
on:
  push:
    branches: [site-audit]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE: https://unify-polish-gecko-site.henibarhoumi1.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.56.1 lighthouse@12.8.2 axe-core@4.10.3 && npx playwright install --with-deps chromium
      - run: curl -sI "$BASE/en/" | head -3
      - run: node tools/full-audit.mjs
      - name: Lighthouse diagnosis (home, phone and desktop)
        run: |
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          for preset in mobile desktop; do
            flag=""; [ $preset = desktop ] && flag="--preset=desktop"
            npx lighthouse "$BASE/en/" --quiet $flag --chrome-flags='--headless=new --no-sandbox' --output=json --output-path=lh-$preset.json >/dev/null 2>&1 || true
            node -e "
            const j=require('./lh-$preset.json');const a=j.audits;
            console.log('LH $preset', Object.entries(j.categories).map(([k,v])=>k+'='+Math.round(v.score*100)).join(' '));
            console.log('LH $preset LCP', a['largest-contentful-paint'].displayValue, 'FCP', a['first-contentful-paint'].displayValue, 'TBT', a['total-blocking-time'].displayValue, 'CLS', a['cumulative-layout-shift'].displayValue, 'SI', a['speed-index'].displayValue);
            const el=a['largest-contentful-paint-element']; console.log('LH $preset LCP element', JSON.stringify(el&&el.details&&el.details.items).slice(0,900));
            for (const k of ['render-blocking-resources','unused-javascript','bootup-time','mainthread-work-breakdown','font-display','uses-long-cache-ttl','total-byte-weight','dom-size','unminified-javascript','legacy-javascript','third-party-summary']) { const x=a[k]; if (x && x.score!==null && x.score<0.9) console.log('LH $preset FLAG', k, x.displayValue||'', JSON.stringify((x.details&&x.details.items||[]).slice(0,3)).slice(0,400)); }
            "
          done
      - name: Save results to the site-audit-results branch
        run: |
          rm -f out/lh/*.json
          cd out && git init -q && git checkout -q -b site-audit-results
          git -c user.name=audit -c user.email=audit@users.noreply.github.com add -A
          git -c user.name=audit -c user.email=audit@users.noreply.github.com commit -qm "audit results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site-audit-results
