name: site-audit
# A one-off look at the live site from outside: screenshots on desktop and phone, page basics, broken
# links, and Lighthouse scores. Results are uploaded as an artifact.
on:
  push:
    branches: [site-audit]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE: https://gecko-site.henibarhoumi1.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.56.1 lighthouse@12.8.2 axe-core@4.10.3 && npx playwright install --with-deps chromium
      - run: curl -sI "$BASE/en/" | head -3
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: node tools/load-video.mjs
      - run: node tools/scroll-perf.mjs
      - name: What moves while the home page loads (Lighthouse)
        run: |
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          for p in en/ fr/; do
            npx lighthouse "$BASE/$p" --quiet --preset=desktop --chrome-flags='--headless=new --no-sandbox' --output=json --output-path=lh.json >/dev/null 2>&1 || true
            node -e "const j=require('./lh.json');const a=j.audits;console.log('CLS $p', a['cumulative-layout-shift'].displayValue);for(const k of ['layout-shifts','layout-shift-elements']){const x=a[k];if(x&&x.details&&x.details.items)console.log('CLS $p '+k, JSON.stringify(x.details.items.slice(0,4).map(i=>({node:i.node&&(i.node.selector||i.node.snippet),score:i.score,cause:i.subItems&&i.subItems.items&&i.subItems.items.map(s=>s.extra&&s.extra.value||s.cause).slice(0,3)}))).slice(0,900))}"
          done
      - name: Save results to the site-audit-results branch
        run: |
          rm -f out/lh/*.json
          cd out && git init -q && git checkout -q -b site-audit-results
          git -c user.name=audit -c user.email=audit@users.noreply.github.com add -A
          git -c user.name=audit -c user.email=audit@users.noreply.github.com commit -qm "audit results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site-audit-results
